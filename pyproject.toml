[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viseda"
version = "1.0.0"
description = "Visual Exploratory Data Analysis for image, video, hyperspectral, point-cloud, and text/NLP datasets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Isaac Osei Agyemang, Daniel Acheampong, Adu Asare Baffour, Isaac Adjei-Mensah" },
]
keywords = [
  "EDA",
  "exploratory data analysis",
  "image",
  "video",
  "hyperspectral",
  "point cloud",
  "LiDAR",
  "text",
  "NLP",
  "computer vision",
  "remote sensing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.6",
  "scikit-learn>=1.2",
  "scikit-image>=0.20",
  "opencv-python>=4.7",
]

[project.optional-dependencies]
hyperspectral = [
  "scipy>=1.10",
  "spectral>=0.23",
  "rasterio>=1.3",
]

pointcloud = [
  "laspy[lazrs]>=2.3",
]

all = [
  "scipy>=1.10",
  "spectral>=0.23",
  "rasterio>=1.3",
  "laspy[lazrs]>=2.3",
]

dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "build>=1.0",
  "twine>=5.0",
]

[project.scripts]
viseda = "viseda.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["viseda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
