[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "viseda"
version = "0.1.0"
description = "Visual Exploratory Data Analysis for images, hyperspectral data and point clouds"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Isaac Osei Agyemang" },
]
keywords = [
  "EDA", "exploratory data analysis", "image", "hyperspectral",
  "point cloud", "LiDAR", "computer vision", "remote sensing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Scientific/Engineering :: GIS",
]

# ── Core dependencies (always installed) ─────────────────────────────
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.6",
  "scikit-learn>=1.2",
  "opencv-python>=4.7",
  "Pillow>=9.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
# Hyperspectral support
hyperspectral = [
  "spectral>=0.23",    # ENVI file reader
  "rasterio>=1.3",     # GeoTIFF multi-band
]

# Point cloud support
pointcloud = [
  "laspy[lazrs]>=2.3",   # LAS/LAZ
  "open3d>=0.17",        # PLY, PCD, visualisation
  "plyfile>=0.9",        # lightweight PLY fallback
  "scipy>=1.10",         # spatial stats
]

# Report extras
report = [
  "jinja2>=3.1",
]

# Full install
all = [
  "viseda[hyperspectral,pointcloud,report]",
]

# Dev / test
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=23.0",
  "ruff>=0.1",
  "mypy>=1.5",
  "build>=1.0",
  "twine>=4.0",
  "pre-commit>=3.4",
]

[project.urls]
Homepage      = "https://github.com/your-org/viseda"
Documentation = "https://viseda.readthedocs.io"
Repository    = "https://github.com/your-org/viseda"
"Bug Tracker" = "https://github.com/your-org/viseda/issues"
Changelog     = "https://github.com/your-org/viseda/blob/main/CHANGELOG.md"

# ── CLI entry points ──────────────────────────────────────────────────
[project.scripts]
viseda = "viseda.cli:main"

# ── Tool config ───────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["viseda*"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=viseda --cov-report=term-missing"
